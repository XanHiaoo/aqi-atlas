name: Refresh published AQI data

on:
  schedule:
    # UTC; 00:17 and 06:17 in Asia/Shanghai. GitHub may queue scheduled runs.
    - cron: '17 16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-aqi-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Fetch and validate AQI.in daily values
        env:
          AQIIN_CLIENT_TOKEN: ${{ secrets.AQIIN_CLIENT_TOKEN }}
        run: python -m aqirec.pages refresh
      - name: Commit validated data
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- site-data/snapshot.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- site-data/snapshot.json
            git commit -m 'data: refresh published AQI snapshot'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
